# 依存パッケージを毎週見る（仕様: docs/features/dependency-vulnerability-audit.md の B-1）
#
# - groups の group-by: dependency-name で、同じ依存の更新を tools / games / learn の
#   3 ディレクトリまとめて 1 本の PR にする（既定はディレクトリごとに別の PR で、
#   scripts/test/deps-aligned.test.mjs が各 PR で落ちる）。version updates にだけ効く
# - セキュリティ更新は group-by も上限も効かず、ディレクトリごとに別の PR が出る。
#   3 本を揃えてからマージする（仕様書の B-1）
# - コミットのプレフィックスは feat（CLAUDE.md の約束。docs: と feat: 以外は使わない）
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/tools", "/games", "/learn"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      next-stack:
        patterns: ["next", "react", "react-dom", "sharp", "@types/react*", "eslint-config-next"]
        group-by: dependency-name
      dev-tools:
        dependency-type: development
        group-by: dependency-name
    commit-message:
      prefix: "feat"
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "feat"
