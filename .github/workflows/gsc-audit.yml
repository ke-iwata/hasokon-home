name: GSC audit

# Search Console の URL検査APIで、サイトマップ全URLの登録状況を週1回数える。
# 仕様: docs/features/google-index-recovery.md の「A. 監査スクリプトの内訳出力」
#
# あわせて、AIアシスタント経由の流入（GA4 の AI Assistant チャネル）も同じ枠で数える。
# 仕様: docs/features/ai-assistant-channel.md の「A. 週次レポートに AI チャネルを足す」
# 同じサービスアカウント（analytics.readonly を既に持っている）で取れるので、
# ジョブもSecretも増やさない。
#
# Bing Webmaster Tools の検索パフォーマンス（表示回数・検索語・ページ）も同じ枠で取る。
# 仕様: docs/features/bing-search-performance-audit.md の「C」
# Google のサービスアカウントとは無関係なので、GSC が飛ばされた週でも動く。
#
# 見るのは coverageState 別の内訳で、判定は「登録（Submitted and indexed）が
# 4週連続で増えているか」。結果は Actions のログと artifact に残すだけで、
# **リポジトリにはcommitしない**（生成物を履歴に混ぜないため）。
on:
  schedule:
    # 毎週月曜 09:00 JST（= 00:00 UTC）。週明けに前週ぶんを見る
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: URL検査APIで登録状況を数える
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 計測する
        id: audit
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Secret は運営者が登録するまで空。仕様書では画面作業のあとなので、
          # 未設定のうちは失敗させず、警告だけ出して飛ばす
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICE_ACCOUNT_JSON が未設定なので計測を飛ばしました。docs/features/google-index-recovery.md を参照"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p audit-out
          # 既定のシェルは bash -e なので、`|| code=$?` で受けないと
          # 終了コード 1 の時点でステップごと落ちる
          code=0
          node scripts/gsc-canonical-audit.mjs --out "audit-out/gsc-audit-$(date -u +%Y-%m-%d).json" || code=$?

          # 終了コード 1 は「旧サブドメインが残っている／検査に失敗したURLがある」で、
          # いまは1がふつう。ジョブを落とすのは 2（実行できなかった）だけにする
          if [ "$code" -ge 2 ]; then
            echo "::error::計測を実行できませんでした（終了コード $code）"
            exit "$code"
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: AIアシスタント経由の流入を数える
        if: steps.audit.outputs.skipped == 'false'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # GA4 は Search Console とは別のAPIなので、権限が足りないと2で落ちる。
          # **こちらの失敗で GSC の結果まで落とさない**（主目的は上のステップ）。
          # 気づける場所は Actions の警告と、下の artifact に無いこと。
          # page_view の無いセッションが 1 割を超えたときも ::warning:: が出る（終了コードは0。
          # docs/features/web-vitals-phantom-sessions.md の C）
          code=0
          node scripts/ga4-ai-channel.mjs --out "audit-out/ga4-ai-$(date -u +%Y-%m-%d).json" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::AIチャネルの計測に失敗しました（終了コード $code）。サービスアカウントに GA4 プロパティの閲覧権限があるか確認してください。docs/features/ai-assistant-channel.md を参照"
          fi

      - name: Bing の検索パフォーマンスを取る
        # GSC のステップが飛ばされた・落ちた週でも取る（Bing は Google の認証と関係が無い）
        if: ${{ !cancelled() }}
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          # キーは運営者が発行して登録するまで空。未設定のうちは警告だけ出して飛ばす
          if [ -z "$BING_WEBMASTER_API_KEY" ]; then
            echo "::warning::Secret BING_WEBMASTER_API_KEY が未設定なので Bing の計測を飛ばしました。docs/features/bing-search-performance-audit.md の D を参照"
            exit 0
          fi

          # GSC のステップが飛ばされていると audit-out/ が無い
          mkdir -p audit-out
          # **Bing の失敗でその週の GSC・GA4 の結果を失わない**。キーの期限切れ・
          # レート制限はふつうに起こるので、終了コードは警告にとどめる
          code=0
          node scripts/bing-search-stats.mjs --site https://hasokon.com/ --out "audit-out/bing-$(date -u +%Y-%m-%d).json" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Bing の計測に失敗しました（終了コード $code）。API キーの期限を確認してください。docs/features/bing-search-performance-audit.md を参照"
          fi

      - name: 結果を artifact に残す
        # Bing だけが動いた週も残す
        if: always() && hashFiles('audit-out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gsc-audit-${{ github.run_id }}
          path: audit-out/
          retention-days: 90
