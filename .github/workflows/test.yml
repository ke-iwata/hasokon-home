name: Test

# node --test で動くテスト（scripts/ の計測スクリプトと home/ のポータル）と、
# tools / games / learn の vitest とビルド（deploy.yml の build-* と同じ手順）。
# アプリのビルドを PR で回すのは、Dependabot の依存更新 PR がビルドを壊していないかを
# マージ前に見るため（仕様: docs/features/dependency-vulnerability-audit.md の A-0）。
# ネットワークもGoogleの認証情報も要らない（すべて差し替えて動かしている）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: scripts / home のテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test/sitemap-home-lastmod.test.mjs が `git log` で home/ のHTMLの
          # 最終変更日を見るため、履歴を全部持ってくる。既定の fetch-depth: 1 では
          # 1コミットが全ファイルを作成した扱いになり、全URLが「今日変更された」
          # ことになって常に落ちる（仕様: docs/features/sitemap-lastmod-guardrail.md の A-1）
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: node --test
        run: node --test "scripts/test/*.test.mjs"

  apps:
    name: ${{ matrix.app }} テスト & ビルド
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [tools, games, learn]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci

      - run: npm test

      - name: 静的サイトのビルド
        run: npm run build
