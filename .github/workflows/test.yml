name: Test

# node --test で動くテスト（scripts/ の計測スクリプトと home/ のポータル）。
# tools/ と games/ は各ディレクトリの vitest で別に動かす。
# ネットワークもGoogleの認証情報も要らない（すべて差し替えて動かしている）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: scripts / home のテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node --test
        run: node --test "scripts/test/*.test.mjs"
