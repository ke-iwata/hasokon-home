name: Deploy

# main へのマージ → テスト環境（Basic認証つき）
# v* タグのpush → 本番
# 1つのタグで home + tools + games をまとめてリリースする
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'test' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  AWS_REGION: ap-northeast-1

jobs:
  build-tools:
    name: tools テスト & ビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci

      - name: 計算ロジックのテスト
        run: npm test

      - name: 静的サイトのビルド
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: tools-site
          path: tools/out/
          retention-days: 3

  build-games:
    name: games テスト & ビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: games/package-lock.json

      - run: npm ci

      - name: ゲームロジックのテスト
        run: npm test

      - name: 静的サイトのビルド
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: games-site
          path: games/out/
          retention-days: 3

  deploy:
    name: ${{ startsWith(github.ref, 'refs/tags/') && '本番へデプロイ' || 'テスト環境へデプロイ' }}
    needs: [build-tools, build-games]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # タグなら本番、mainならテスト環境
      - name: デプロイ先を判定
        id: target
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
          PROD_BUCKET: ${{ secrets.S3_BUCKET }}
          PROD_DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          TEST_BUCKET: ${{ secrets.TEST_S3_BUCKET }}
          TEST_DIST: ${{ secrets.TEST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ "${IS_RELEASE}" = "true" ]; then
            bucket="${PROD_BUCKET}"; dist="${PROD_DIST}"; url="https://hasokon.com/"
          else
            bucket="${TEST_BUCKET}"; dist="${TEST_DIST}"; url="https://test.hasokon.com/"
          fi
          if [ -z "${bucket}" ] || [ -z "${dist}" ]; then
            echo "::error::デプロイ先のSecretsが未設定です"
            exit 1
          fi
          {
            echo "bucket=${bucket}"
            echo "dist=${dist}"
            echo "url=${url}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          name: tools-site
          path: tools-out

      - uses: actions/download-artifact@v4
        with:
          name: games-site
          path: games-out

      - name: AWS認証（OIDC・長期キー不要）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 先にアセットを上げてからHTMLを差し替える。逆にすると、新しいHTMLが
      # まだ存在しないJSを参照する瞬間ができてしまう。
      # アセット同期で --delete しないのは、古いHTMLをキャッシュしている
      # 利用者が直後にJSを404にされるのを避けるため。
      # s-maxage は必須。CloudFront は自分がキャッシュしたオブジェクトしか
      # 圧縮しないため、無いとHTMLが非圧縮で配信される
      - name: S3へ同期（tools）
        run: |
          aws s3 sync tools-out/ s3://${{ steps.target.outputs.bucket }}/tools/ \
            --exclude "*" --include "_next/static/*" --size-only \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync tools-out/ s3://${{ steps.target.outputs.bucket }}/tools/ \
            --delete --exclude "_next/static/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      - name: S3へ同期（games）
        run: |
          aws s3 sync games-out/ s3://${{ steps.target.outputs.bucket }}/games/ \
            --exclude "*" --include "_next/static/*" --size-only \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync games-out/ s3://${{ steps.target.outputs.bucket }}/games/ \
            --delete --exclude "_next/static/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      # テスト環境にだけ、公開前（stage が public 以外）のツール・ゲームを
      # トップの一覧に足す。home/ にはビルド工程が無く stage が効かないので、
      # ここで差し込む（docs/features/test-home-unreleased.md）。
      # **タグ（本番）のときは通らない**ので、本番のHTMLは無改変のまま
      - name: テスト環境向けにトップの一覧を作る
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/build-test-home.mjs

      # バケット直下は home/ の中身だけ。tools/ games/ は上の同期が管理
      # しているので削除対象から除外する
      - name: S3へ同期（home）
        run: |
          aws s3 sync home/ s3://${{ steps.target.outputs.bucket }}/ \
            --delete \
            --exclude "tools/*" \
            --exclude "games/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      - name: CloudFrontのキャッシュを削除
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.target.outputs.dist }} \
            --paths "/*"

      - name: デプロイ完了
        run: echo "デプロイ完了 → ${{ steps.target.outputs.url }}"
