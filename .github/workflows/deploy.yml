name: Deploy

# main へのマージ → テスト環境（Basic認証つき）
# v* タグのpush → 本番
# 1つのタグで home + tools + games + learn をまとめてリリースする
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'test' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  AWS_REGION: ap-northeast-1

jobs:
  build-tools:
    name: tools テスト & ビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci

      - name: 計算ロジックのテスト
        run: npm test

      - name: 静的サイトのビルド
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: tools-site
          path: tools/out/
          retention-days: 3

  build-games:
    name: games テスト & ビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: games/package-lock.json

      - run: npm ci

      - name: ゲームロジックのテスト
        run: npm test

      - name: 静的サイトのビルド
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: games-site
          path: games/out/
          retention-days: 3

  build-learn:
    name: learn テスト & ビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: learn/package-lock.json

      - run: npm ci

      - name: カリキュラム・参考文献・編集方針のテスト
        run: npm test

      - name: 静的サイトのビルド
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: learn-site
          path: learn/out/
          retention-days: 3

  deploy:
    name: ${{ startsWith(github.ref, 'refs/tags/') && '本番へデプロイ' || 'テスト環境へデプロイ' }}
    needs: [build-tools, build-games, build-learn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # タグなら本番、mainならテスト環境
      - name: デプロイ先を判定
        id: target
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
          PROD_BUCKET: ${{ secrets.S3_BUCKET }}
          PROD_DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          TEST_BUCKET: ${{ secrets.TEST_S3_BUCKET }}
          TEST_DIST: ${{ secrets.TEST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ "${IS_RELEASE}" = "true" ]; then
            bucket="${PROD_BUCKET}"; dist="${PROD_DIST}"; url="https://hasokon.com/"
          else
            bucket="${TEST_BUCKET}"; dist="${TEST_DIST}"; url="https://test.hasokon.com/"
          fi
          if [ -z "${bucket}" ] || [ -z "${dist}" ]; then
            echo "::error::デプロイ先のSecretsが未設定です"
            exit 1
          fi
          {
            echo "bucket=${bucket}"
            echo "dist=${dist}"
            echo "url=${url}"
          } >> "${GITHUB_OUTPUT}"

      # 本番だけ。IndexNow は「変更したURLの通知」なので、同期する前の
      # サイトマップを取っておき、同期後のものと <lastmod> で突き合わせて
      # 差分だけ送る（docs/features/indexnow.md）。
      # 取れなくても続行する（そのときは全件送る側に倒れる）
      - name: 通知の差分用に、いまの本番サイトマップを保存
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p /tmp/sitemaps-before
          for p in sitemap-home.xml tools/sitemap.xml games/sitemap.xml learn/sitemap.xml; do
            out="/tmp/sitemaps-before/${p//\//-}"
            curl -fsS --max-time 30 -o "${out}" "https://hasokon.com/${p}" \
              || echo "::notice::${p} を取得できませんでした。取れなかった分は全件送る側に倒れます"
          done

      - uses: actions/download-artifact@v4
        with:
          name: tools-site
          path: tools-out

      - uses: actions/download-artifact@v4
        with:
          name: games-site
          path: games-out

      - uses: actions/download-artifact@v4
        with:
          name: learn-site
          path: learn-out

      # 差分の「後」側。**配信中のサイトマップをHTTPで取りに行かない。**
      # CloudFront のキャッシュ次第でデプロイ前と同じものが返り、差分が0件になって
      # 黙って送り漏れる（無効化の完了待ちは権限不足・タイムアウトで飛びうる）。
      # ここで渡すのは、この直後に同期するファイルそのもの
      - name: 通知の差分用に、いま同期するサイトマップを取る
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p /tmp/sitemaps-after
          ok=1
          cp home/sitemap-home.xml /tmp/sitemaps-after/sitemap-home.xml || ok=0
          for s in tools games learn; do
            cp "${s}-out/sitemap.xml" "/tmp/sitemaps-after/${s}-sitemap.xml" || ok=0
          done
          [ "${ok}" = 1 ] \
            || echo "::warning::同期するサイトマップの一部をコピーできませんでした。その分は IndexNow に通知されません"

      - name: AWS認証（OIDC・長期キー不要）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 先にアセットを上げてからHTMLを差し替える。逆にすると、新しいHTMLが
      # まだ存在しないJSを参照する瞬間ができてしまう。
      # アセット同期で --delete しないのは、古いHTMLをキャッシュしている
      # 利用者が直後にJSを404にされるのを避けるため。
      # s-maxage は必須。CloudFront は自分がキャッシュしたオブジェクトしか
      # 圧縮しないため、無いとHTMLが非圧縮で配信される
      - name: S3へ同期（tools）
        run: |
          aws s3 sync tools-out/ s3://${{ steps.target.outputs.bucket }}/tools/ \
            --exclude "*" --include "_next/static/*" --size-only \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync tools-out/ s3://${{ steps.target.outputs.bucket }}/tools/ \
            --delete --exclude "_next/static/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      - name: S3へ同期（games）
        run: |
          aws s3 sync games-out/ s3://${{ steps.target.outputs.bucket }}/games/ \
            --exclude "*" --include "_next/static/*" --size-only \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync games-out/ s3://${{ steps.target.outputs.bucket }}/games/ \
            --delete --exclude "_next/static/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      - name: S3へ同期（learn）
        run: |
          aws s3 sync learn-out/ s3://${{ steps.target.outputs.bucket }}/learn/ \
            --exclude "*" --include "_next/static/*" --size-only \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync learn-out/ s3://${{ steps.target.outputs.bucket }}/learn/ \
            --delete --exclude "_next/static/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      # テスト環境にだけ、公開前（stage が public 以外）のツール・ゲームを
      # トップの一覧に足す。home/ にはビルド工程が無く stage が効かないので、
      # ここで差し込む（docs/features/test-home-unreleased.md）。
      # **タグ（本番）のときは通らない**ので、本番のHTMLは無改変のまま
      - name: テスト環境向けにトップの一覧を作る
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/build-test-home.mjs

      # バケット直下は home/ の中身だけ。tools/ games/ learn/ は上の同期が
      # 管理しているので削除対象から除外する
      - name: S3へ同期（home）
        run: |
          aws s3 sync home/ s3://${{ steps.target.outputs.bucket }}/ \
            --delete \
            --exclude "tools/*" \
            --exclude "games/*" \
            --exclude "learn/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      - name: CloudFrontのキャッシュを削除
        id: invalidation
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id ${{ steps.target.outputs.dist }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "id=${id}" >> "${GITHUB_OUTPUT}"
          echo "無効化 ${id} を作成しました"

      # create-invalidation は非同期で、完了まで数分かかる。待たずに通知すると
      # Bing が古いHTMLを取り直してしまう（docs/features/indexnow.md）。
      # 待ちきれなくてもリリース自体は済んでいるので、デプロイは落とさない
      - name: CloudFrontの無効化の完了を待つ
        id: wait-invalidation
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ steps.target.outputs.dist }} \
            --id ${{ steps.invalidation.outputs.id }}

      # 待てなかったこと自体は送信を止める理由にならない（差分はファイルから出している）。
      # ただし権限不足に気づけるよう、画面に残す
      - name: 無効化を待てなかったことを知らせる
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.wait-invalidation.outcome != 'success' }}
        run: |
          echo "::warning::CloudFront の無効化の完了を待てませんでした（cloudfront:GetInvalidation の権限不足、またはタイムアウト）。IndexNow の通知は送りますが、Bing が古いHTMLを取り直す可能性があります"

      # 更新したURLを Bing ほかに通知する（docs/features/indexnow.md）。
      # テスト環境は Basic認証の裏なので送らない。鍵は home/<key>.txt の1か所だけで、
      # Secrets には置かない（2か所がずれた瞬間に全送信が403になる）
      - name: IndexNow に更新を通知
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          node scripts/indexnow-submit.mjs \
            --key-file home/bd59c05dafed335478f48aefb1c0ec57.txt \
            --before /tmp/sitemaps-before \
            --after /tmp/sitemaps-after \
            --sitemap https://hasokon.com/sitemap.xml

      - name: デプロイ完了
        run: echo "デプロイ完了 → ${{ steps.target.outputs.url }}"
