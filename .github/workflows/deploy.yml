name: Deploy

# main へのマージ → テスト環境（Basic認証つき）
# v* タグのpush → 本番
# ビルド工程のない素の静的HTMLなので、リポジトリの中身をそのまま同期する
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'test' }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1
  PROD_URL: https://hasokon.com/
  TEST_URL: https://test.hasokon.com/

jobs:
  deploy:
    name: ${{ startsWith(github.ref, 'refs/tags/') && '本番へデプロイ' || 'テスト環境へデプロイ' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # タグなら本番、mainならテスト環境。
      # infra/setup.sh 実行前（Secrets未設定）はスキップして成功扱いにする
      - name: デプロイ先を判定
        id: target
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
          PROD_BUCKET: ${{ secrets.S3_BUCKET }}
          PROD_DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          TEST_BUCKET: ${{ secrets.TEST_S3_BUCKET }}
          TEST_DIST: ${{ secrets.TEST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ "${IS_RELEASE}" = "true" ]; then
            bucket="${PROD_BUCKET}"; dist="${PROD_DIST}"; url="${PROD_URL}"
          else
            bucket="${TEST_BUCKET}"; dist="${TEST_DIST}"; url="${TEST_URL}"
          fi
          if [ -z "${bucket}" ] || [ -z "${dist}" ]; then
            echo "::warning::デプロイ先のSecretsが未設定のためスキップします（infra/setup.sh を実行してください）"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo "skip=false"
            echo "bucket=${bucket}"
            echo "dist=${dist}"
            echo "url=${url}"
          } >> "${GITHUB_OUTPUT}"

      - name: AWS認証（OIDC・長期キー不要）
        if: steps.target.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3へ同期
        if: steps.target.outputs.skip != 'true'
        run: |
          aws s3 sync . s3://${{ steps.target.outputs.bucket }}/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "infra/*" \
            --exclude "README.md" \
            --exclude "CLAUDE.md" \
            --exclude "docs/*" \
            --exclude ".gitignore" \
            --exclude "tools/*" \
            --exclude "games/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      - name: CloudFrontのキャッシュを削除
        if: steps.target.outputs.skip != 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.target.outputs.dist }} \
            --paths "/*"

      - name: デプロイ完了
        if: steps.target.outputs.skip != 'true'
        run: echo "${{ steps.target.outputs.url }} に反映されました"
