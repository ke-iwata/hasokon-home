AWSTemplateFormatVersion: '2010-09-09'
Description: >
  hasokon tools - 静的サイトの配信基盤。
  S3（非公開）+ CloudFront（OAC）+ Route 53 のAレコード + GitHub Actions用のOIDCロールを作る。
  証明書は infra/certificate.yaml で us-east-1 に作ったものを CertificateArn で渡す。

Parameters:
  DomainName:
    Type: String
    Default: tool.hasokon.com
    Description: 公開するドメイン名

  BucketName:
    Type: String
    Default: tool-hasokon-com
    Description: 静的ファイルを置くS3バケット名（全世界で一意である必要がある）

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: 親ドメイン（hasokon.com）のRoute 53ホストゾーンID

  CertificateArn:
    Type: String
    Description: us-east-1 のACM証明書ARN（infra/certificate.yaml の出力）

  GitHubRepository:
    Type: String
    Default: ke-iwata/hasokon-tools
    Description: デプロイを許可するGitHubリポジトリ（owner/repo）

  CreateGitHubOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      GitHubのOIDCプロバイダをこのスタックで作るか。
      アカウントに既に登録済みの場合は false にすること（重複作成はエラーになる）。

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateGitHubOIDCProvider, 'true']

Resources:
  # ---------------------------------------------------------------- S3

  SiteBucket:
    Type: AWS::S3::Bucket
    # スタックを消してもサイトのファイルは残す（誤削除の保険）
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      # 静的ウェブサイトホスティングは使わない。CloudFront + OAC 経由のみで配信する
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          # ハッシュ付きの古いビルド成果物を自動で片付ける。
          # デプロイ時に消さないのは、古いHTMLをキャッシュしている利用者が
          # 直後に404になるのを避けるため（DEPLOY.md「デプロイの流れ」参照）
          - Id: expire-old-build-assets
            Status: Enabled
            Prefix: _next/static/
            NoncurrentVersionExpirationInDays: 1
            ExpirationInDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: hasokon-tools

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # CloudFrontのこのディストリビューションからの読み取りだけを許可する
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          # 平文HTTPでのアクセスを拒否
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------------------------------------------------------------- CloudFront

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # trailingSlash: true で出力しているため、/warikan/ を /warikan/index.html に書き換える。
  # これが無いと S3 にキーが存在せず全ページ403になる
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: サブディレクトリURLをindex.htmlに書き換える
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'hasokon tools (${DomainName})'
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized（AWS管理ポリシー）
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # S3 + OAC では存在しないキーへのアクセスが403で返るため、403も404ページに向ける。
          # レスポンスコードを200にすると存在しないURLがインデックスされるので必ず404を返す
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: Project
          Value: hasokon-tools

  # ---------------------------------------------------------------- DNS

  DnsRecordV4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # Z2FDTNDATAQYW2 は CloudFront 固定のホストゾーンID
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

  DnsRecordV6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

  # ---------------------------------------------------------------- GitHub Actions（OIDC）

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-deploy'
      Description: GitHub Actions から静的サイトをデプロイするためのロール（長期キー不要）
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # このリポジトリからのワークフローだけに限定する
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:*'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Description: GitHub Secrets の S3_BUCKET に設定する値
    Value: !Ref SiteBucket

  DistributionId:
    Description: GitHub Secrets の CLOUDFRONT_DISTRIBUTION_ID に設定する値
    Value: !Ref Distribution

  DeployRoleArn:
    Description: GitHub Secrets の AWS_DEPLOY_ROLE_ARN に設定する値
    Value: !GetAtt DeployRole.Arn

  DistributionDomainName:
    Description: CloudFrontのドメイン名（DNS切り替え前の動作確認用）
    Value: !GetAtt Distribution.DomainName

  SiteUrl:
    Description: 公開URL
    Value: !Sub 'https://${DomainName}/'
