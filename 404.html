<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Search Console の所有権確認用。確認後も削除しないこと -->
    <meta name="google-site-verification" content="Q3DpEEDOkoxOZDuQwfCl_kDDbsdaqLxHDJrCcJOZvnU" />
    <title>ページが見つかりません｜hasokon</title>
    <meta name="robots" content="noindex, follow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230ea5e9'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='33' fill='%23fff' font-family='Helvetica,Arial,sans-serif' font-size='40' font-weight='700' text-anchor='middle' dominant-baseline='central'%3Eh%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f7f8fb;
        --surface: #fff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --brand: #4f46e5;
        --brand-from: #0ea5e9;
        --brand-to: #6366f1;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          'Hiragino Sans', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.8;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
      }
      h1 span {
        background: linear-gradient(90deg, var(--brand-from), var(--brand-to));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .lead {
        color: var(--muted);
        margin: 12px 0 28px;
        font-size: 0.95rem;
      }
      .card {
        display: block;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px 22px;
        text-align: left;
        text-decoration: none;
        color: inherit;
        margin-bottom: 12px;
        transition: border-color 0.15s, transform 0.15s;
      }
      .card:hover {
        border-color: var(--brand);
        transform: translateY(-2px);
      }
      .card .name {
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--brand);
      }
      .card .desc {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 4px;
      }
      footer {
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ページが<span>見つかりません</span></h1>
      <p class="lead">
        URLが変わったか、入力に誤りがあるかもしれません。
      </p>

      <a class="card" href="https://tool.hasokon.com/">
        <div class="name">無料計算ツール集 →</div>
        <div class="desc">
          年収の壁・子ども・子育て支援金・傷病手当金などの計算機と、
          ルーレット・グループ分け・サイコロなどの「決める」道具。
        </div>
      </a>

      <a class="card" href="https://game.hasokon.com/">
        <div class="name">無料ミニゲーム集 →</div>
        <div class="desc">
          ソリティア・マインスイーパー・2048・ナンプレなど、
          インストール不要でそのまま遊べるゲーム。
        </div>
      </a>

      <a class="card" href="/">
        <div class="name">hasokon.com のトップへ →</div>
      </a>

      <footer>© 2026 hasokon tools All rights reserved.</footer>
    </main>
  </body>
</html>
