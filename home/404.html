<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Search Console の所有権確認用。確認後も削除しないこと -->
    <meta name="google-site-verification" content="Q3DpEEDOkoxOZDuQwfCl_kDDbsdaqLxHDJrCcJOZvnU" />
    <title>ページが見つかりません｜hasokon</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Google Analytics 4。index.html と同じ2行（実装は /analytics.js）。
      404がどのURLで出ているかは、旧サブドメインからの移行が終わったかの判断材料になる。
      404はどのURLでも表示されるので、パスは必ず絶対で書くこと。
      仕様: docs/features/measurement-hygiene.md
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2Z0K6Y2FX0"></script>
    <script defer src="/analytics.js"></script>
    <style>
      /* デザイントークン。原典は /design/tokens.css。index.html と同じ値にすること */
      :root {
        color-scheme: light dark;
        --bg: #faf9f7;
        --surface: #ffffff;
        --text: #1c1917;
        --muted: #6f6a65;
        --border: #e5e2dd;
        --accent: #15803d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1817;
          --surface: #242120;
          --text: #f2efec;
          --muted: #a8a29c;
          --border: #3d3835;
          --accent: #4ade80;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          'Hiragino Sans', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.8;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
      }
      /* グラデーション文字は使わない（home/tools/games と揃える） */
      h1 span {
        color: var(--accent);
      }
      .lead {
        color: var(--muted);
        margin: 12px 0 28px;
        font-size: 0.95rem;
      }
      .card {
        display: block;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px 22px;
        text-align: left;
        text-decoration: none;
        color: inherit;
        margin-bottom: 12px;
        transition: border-color 0.15s, transform 0.15s;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .card .name {
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--accent);
      }
      .card .desc {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 4px;
      }
      footer {
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ページが<span>見つかりません</span></h1>
      <p class="lead">
        URLが変わったか、入力に誤りがあるかもしれません。
      </p>

      <a class="card" href="/tools/">
        <div class="name">無料計算ツール集 →</div>
        <div class="desc">
          年収の壁・子ども・子育て支援金・傷病手当金などの計算機と、
          ルーレット・グループ分け・サイコロなどの「決める」道具。
        </div>
      </a>

      <a class="card" href="/games/">
        <div class="name">無料ミニゲーム集 →</div>
        <div class="desc">
          ソリティア・マインスイーパー・2048・ナンプレなど、
          インストール不要でそのまま遊べるゲーム。
        </div>
      </a>

      <a class="card" href="/">
        <div class="name">hasokon.com のトップへ →</div>
      </a>

      <footer>
        <a href="/privacy.html" style="color: inherit">プライバシーポリシー</a>
        ／ © 2026 hasokon tools All rights reserved.
      </footer>
    </main>
  </body>
</html>
