AWSTemplateFormatVersion: '2010-09-09'
Description: >
  hasokon tools - 静的サイトの配信基盤。
  S3（非公開）+ CloudFront（OAC）+ Route 53 のAレコード + GitHub Actions用のOIDCロールを作る。
  証明書は infra/certificate.yaml で us-east-1 に作ったものを CertificateArn で渡す。

Parameters:
  DomainName:
    Type: String
    Default: game.hasokon.com
    Description: 公開するドメイン名

  BucketName:
    Type: String
    Default: game-hasokon-com
    Description: 静的ファイルを置くS3バケット名（全世界で一意である必要がある）

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: 親ドメイン（hasokon.com）のRoute 53ホストゾーンID

  CertificateArn:
    Type: String
    Description: us-east-1 のACM証明書ARN（infra/certificate.yaml の出力）

  GitHubRepository:
    Type: String
    Default: ke-iwata/hasokon-games
    Description: デプロイを許可するGitHubリポジトリ（owner/repo）

  OIDCThumbprint:
    Type: String
    Default: ab9d0263244dd0326eb67015705a667e79cfe998
    AllowedPattern: '[0-9a-f]{40}'
    Description: >
      GitHubのOIDCエンドポイントのルート証明書のSHA-1サムプリント。
      証明書は更新されるため、infra/setup.sh が実行時に取得した値で上書きする。
      既定値はISRG Root YR（Let's Encrypt）のもの。

  CreateGitHubOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      GitHubのOIDCプロバイダをこのスタックで作るか。
      アカウントに既に登録済みの場合は false にすること（重複作成はエラーになる）。

  CreateDeployRole:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      GitHub Actions用のデプロイロールをこのスタックで作るか。
      テスト環境スタックでは false にして、本番スタックのロールを共用する
      （本番スタック側の ExtraDeployBucketName でテストバケットへの権限を足す）。

  ExtraDeployBucketName:
    Type: String
    Default: ''
    Description: >
      デプロイロールに追加で読み書きを許可するバケット名（テスト環境のバケット）。
      空なら自分のバケットだけ。

  BasicAuthString:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Basic認証をかける場合の Authorization ヘッダ期待値
      （例: "Basic dXNlcjpwYXNz"）。空なら認証なし。
      テスト環境の閲覧ゲートであり、機密を守るためのものではない。

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateGitHubOIDCProvider, 'true']
  ShouldCreateDeployRole: !Equals [!Ref CreateDeployRole, 'true']
  HasExtraBucket: !Not [!Equals [!Ref ExtraDeployBucketName, '']]

Resources:
  # ---------------------------------------------------------------- S3

  SiteBucket:
    Type: AWS::S3::Bucket
    # スタックを消してもサイトのファイルは残す（誤削除の保険）
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      # 静的ウェブサイトホスティングは使わない。CloudFront + OAC 経由のみで配信する
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          # _next/static/ に有効期限を設定してはいけない。
          # S3のライフサイクルはオブジェクトの作成日からの経過日数で消すため、
          # 現在使われているJSやCSSかどうかを区別できない。期限を付けると、
          # 更新のない期間が続いただけで配信中のアセットが消えてサイトが壊れる。
          # 使われなくなったハッシュ付きファイルは蓄積するが、1ビルドあたり
          # 数百KB程度なので保管料は無視できる。整理したくなったら手動で消すこと
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: hasokon-games

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # CloudFrontのこのディストリビューションからの読み取りだけを許可する
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          # 平文HTTPでのアクセスを拒否
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------------------------------------------------------------- CloudFront

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # trailingSlash: true で出力しているため、全ページが {slug}/index.html というキーになる。
  # 特定のページ向けではなく、末尾スラッシュ・拡張子なしのリクエストすべてを
  # index.html に解決する。これが無いと S3 にキーが存在せず全ページ403になる。
  # 拡張子を含むパス（/ads.txt, /sitemap.xml, /_next/... など）は素通しする
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: サブディレクトリURLをindex.htmlに書き換える
        Runtime: cloudfront-js-2.0
      # BasicAuthString が空でなければBasic認証をかける（テスト環境用）。
      # !Sub は ${BasicAuthString} だけを差し替える。JS側にテンプレートリテラルを
      # 書くと誤って置換されるので、この関数内では文字列連結だけを使うこと
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var expected = '${BasicAuthString}';
          if (expected !== '') {
            var auth = request.headers.authorization;
            if (!auth || auth.value !== expected) {
              return {
                statusCode: 401,
                statusDescription: 'Unauthorized',
                headers: { 'www-authenticate': { value: 'Basic realm="test"' } }
              };
            }
          }
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'hasokon games (${DomainName})'
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized（AWS管理ポリシー）
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # S3 + OAC では存在しないキーへのアクセスが403で返るため、403も404ページに向ける。
          # レスポンスコードを200にすると存在しないURLがインデックスされるので必ず404を返す
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: Project
          Value: hasokon-games

  # ---------------------------------------------------------------- DNS

  DnsRecordV4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # Z2FDTNDATAQYW2 は CloudFront 固定のホストゾーンID
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

  DnsRecordV6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

  # ---------------------------------------------------------------- GitHub Actions（OIDC）

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # 古いサムプリントのままだとトークンの検証に失敗し
      # 「The web identity token provided could not be validated」になる。
      # GitHubの証明書はDigiCertからLet's Encryptに移行済みで、今後も変わりうるため
      # infra/setup.sh が実行時に実際の証明書から取得して渡す
      ThumbprintList:
        - !Ref OIDCThumbprint

  DeployRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateDeployRole
    Properties:
      RoleName: !Sub '${AWS::StackName}-deploy'
      # IAMのdescriptionはLatin-1（ -ÿ）までしか受け付けず、
      # 日本語を入れるとCREATE_FAILEDになる。ここだけ英語にすること
      Description: Deploy role for GitHub Actions (OIDC, no long-lived keys)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # このリポジトリからのワークフローだけに限定する。
                # GitHubは sub に不変ID を含める形式（repo:owner@123/repo@456:...）を
                # 送ることがあり、従来形式だけだと AssumeRoleWithWebIdentity が拒否される。
                # 設定で切り替わるため両方を許可しておく。
                # owner名・repo名はGitHub全体で一意なので @* を付けても他リポジトリには一致しない
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepository}:*'
                  - !Sub
                    - 'repo:${Owner}@*/${Repo}@*:*'
                    - Owner: !Select [0, !Split ['/', !Ref GitHubRepository]]
                      Repo: !Select [1, !Split ['/', !Ref GitHubRepository]]
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !If
                  - HasExtraBucket
                  - - !GetAtt SiteBucket.Arn
                    - !Sub 'arn:aws:s3:::${ExtraDeployBucketName}'
                  - - !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !If
                  - HasExtraBucket
                  - - !Sub '${SiteBucket.Arn}/*'
                    - !Sub 'arn:aws:s3:::${ExtraDeployBucketName}/*'
                  - - !Sub '${SiteBucket.Arn}/*'
              # テスト環境のディストリビューションは別スタックにあるため、
              # ID単位ではなくアカウント内の全ディストリビューションを許可する。
              # CreateInvalidation はキャッシュ削除しかできず、悪用の余地が小さい
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'

Outputs:
  BucketName:
    Description: GitHub Secrets の S3_BUCKET に設定する値
    Value: !Ref SiteBucket

  DistributionId:
    Description: GitHub Secrets の CLOUDFRONT_DISTRIBUTION_ID に設定する値
    Value: !Ref Distribution

  DeployRoleArn:
    Description: GitHub Secrets の AWS_DEPLOY_ROLE_ARN に設定する値（ロールを作らないスタックでは空）
    Value: !If [ShouldCreateDeployRole, !GetAtt DeployRole.Arn, '']

  DistributionDomainName:
    Description: CloudFrontのドメイン名（DNS切り替え前の動作確認用）
    Value: !GetAtt Distribution.DomainName

  SiteUrl:
    Description: 公開URL
    Value: !Sub 'https://${DomainName}/'
