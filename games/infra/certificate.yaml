AWSTemplateFormatVersion: '2010-09-09'
Description: >
  hasokon tools - CloudFront用のACM証明書。
  CloudFrontで使う証明書は us-east-1 にある必要があるため、サイト本体とはスタックを分けている。
  Route 53 のホストゾーンを指定しているので、検証用のCNAMEは自動で作成される
  （スタック作成が数分で終わらない場合は検証待ちなのでそのまま待つこと）。

Parameters:
  DomainName:
    Type: String
    Default: game.hasokon.com
    Description: 証明書を発行するドメイン名

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: 親ドメイン（hasokon.com）のRoute 53ホストゾーンID

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: hasokon-tools

Outputs:
  CertificateArn:
    Description: サイト本体のスタックに渡す証明書のARN
    Value: !Ref Certificate
    Export:
      Name: !Sub '${AWS::StackName}-CertificateArn'
